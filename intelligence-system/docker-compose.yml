version: "3.9"

services:
  osint-intelligence:
    build: .
    container_name: osint-intelligence
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import discord, aiohttp; print('OK')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
